<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <!-- Theme Colors -->
  <meta
    name="theme-color"
    content="#171F27"
    media="(prefers-color-scheme: dark)"
  />

  <meta
    name="theme-color"
    content="#F3EFE4"
    media="(prefers-color-scheme: light)"
  />

  <!-- Primary SEO -->
  <title>Curio — Learn. Research. Speak.</title>

  <meta
    name="description"
    content="Curio transforms curiosity into confidence. Discover fascinating topics, research independently, refine your thinking, and practice speaking with structured AI-guided learning."
  />

  <meta
    name="keywords"
    content="learning, research, speaking practice, communication skills, critical thinking, public speaking, AI learning, education, curiosity"
  />

  <meta name="author" content="Curio" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="Curio — Learn. Research. Speak."
  />

  <meta
    property="og:description"
    content="Build knowledge, confidence, and communication skills through curiosity-driven learning."
  />

  <meta property="og:site_name" content="Curio" />

  <!-- Twitter -->
  <meta
    name="twitter:title"
    content="Curio — Learn. Research. Speak."
  />

  <meta
    name="twitter:description"
    content="Research topics, think critically, and practice speaking with AI-powered guidance."
  />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <!-- Future PWA Support -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

</head>

<body>

  <div id="root"></div>

  <noscript>
    Curio requires JavaScript to deliver interactive research and speaking experiences.
  </noscript>

  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
